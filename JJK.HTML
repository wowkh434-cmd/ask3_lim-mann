<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
         <title>
              Form Information
         </title>
    </head>
    <body>
        <form>
            <table border="1" width="1000px">
                <tr>
                    <th width="500px" style="background-color:powderblue;">Name</th>
                    <th width="500px" style="background-color:powderblue;">Value</th>
                </tr>
                <tr>
                    <td>Name</td>
                    <td>
                        <input size="70px" type="text">
                    </td>
                </tr>
                <tr>
                    <td>Sex</td>
                    <td>
                       
                        <input type="radio" value="Male" id="Male" name="Male_status">
                        <label for="Male">Male</label>
                        <br>
                     
                        <input type="radio" value="Female" id="Male" name="Male_status">
                        <label>Female</label>
                    </td>
                </tr>
                <tr>
                    <td>Eye color</td>
                    <td> 
                        <select>
                            <option>Green</option>
                            <option>Blue</option>
                            <option>Red</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Check all that apply</td>
                    <td>
                        <input type="checkbox" value="over1" id="f1" name="over">
                        <label for="f1"> Over 6 feet tall</label>
                        <br>
                        <input type="checkbox" value="over2" id="f2" name="over">
                        <label for="f2"> Over 200 pounds</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label id="adress"> 
                            <span style="font-size: 20px;"> Describe your athletic ability:</span>
                        </label>
                        <br>
                        <textarea id="adress " rows="5" cols="135"></textarea>
                    </td>                 
                </tr>
                <tr>
                    <th colspan="2">
                        <input  size="135px" type="submit" value="Enter my Information" >
                    </th>
                </tr>
            </table>
        </form>
    </body>
</html>
